<div class="ns3-chart" id="ns3-citations-chart">
  <p class="ns3-chart__loading">Loading chart&hellip;</p>
</div>

<style>
  .ns3-chart {
    position: relative;
    margin: 1.5rem 0;
  }
  .ns3-chart svg {
    width: 100%;
    height: auto;
    overflow: visible;
    font-family: inherit;
  }
  .ns3-chart .ns3-chart__axis-label {
    fill: rgba(255, 255, 255, 0.55);
    font-size: 11px;
  }
  .ns3-chart .ns3-chart__gridline {
    stroke: rgba(255, 255, 255, 0.12);
    stroke-width: 1;
  }
  .ns3-chart .ns3-chart__bar {
    fill: #23B0FF;
  }
  .ns3-chart .ns3-chart__bar--partial {
    fill: #23B0FF;
    fill-opacity: 0.4;
  }
  .ns3-chart .ns3-chart__bar:hover,
  .ns3-chart .ns3-chart__bar--partial:hover {
    fill-opacity: 0.8;
  }
  .ns3-chart__tooltip {
    position: absolute;
    pointer-events: none;
    background: #1D1E28;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    transform: translate(-50%, -100%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s ease;
    z-index: 10;
  }
  .ns3-chart__tooltip.is-visible {
    opacity: 1;
  }
  .ns3-chart__note {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 0.5rem;
  }
  .ns3-chart details.ns3-chart__table-toggle {
    margin-top: 0.75rem;
    font-size: 0.9rem;
  }
  .ns3-chart table.ns3-chart__table {
    border-collapse: collapse;
    margin-top: 0.5rem;
  }
  .ns3-chart table.ns3-chart__table th,
  .ns3-chart table.ns3-chart__table td {
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 2px 10px;
    text-align: right;
  }
</style>

<script src="/js/ns3-citations-data.js"></script>
<script>
(function () {
  var payload = window.NS3_CITATIONS;
  var root = document.getElementById("ns3-citations-chart");
  if (!payload || !root) return;

  var data = payload.data;
  var height = 320;
  var marginTop = 16;
  var marginBottom = 28;
  var marginLeft = 44;
  var marginRight = 8;
  var tickStep = 500;

  var maxCount = Math.max.apply(null, data.map(function (d) { return d.count; }));
  var niceMax = Math.ceil(maxCount / tickStep) * tickStep;

  function svgEl(name, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  var svg = svgEl("svg", { role: "img", "aria-label": "Bar chart of ns-3 related publications per year" });

  var tooltip = document.createElement("div");
  tooltip.className = "ns3-chart__tooltip";

  function showTooltip(d, rect) {
    var rootRect = root.getBoundingClientRect();
    var barRect = rect.getBoundingClientRect();
    tooltip.textContent = d.year + ": " + d.count.toLocaleString() + (d.partial ? " (partial year)" : "");
    tooltip.style.left = (barRect.left - rootRect.left + barRect.width / 2) + "px";
    tooltip.style.top = (barRect.top - rootRect.top - 6) + "px";
    tooltip.classList.add("is-visible");
  }
  function hideTooltip() {
    tooltip.classList.remove("is-visible");
  }

  // The viewBox width is set to the container's actual rendered width (not a
  // fixed value scaled by CSS) so that text stays at its declared pixel size
  // instead of shrinking on narrow screens.
  function render() {
    var width = Math.max(root.clientWidth || 800, 240);
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var plotWidth = width - marginLeft - marginRight;
    var plotHeight = height - marginTop - marginBottom;
    var barGap = 2;
    var barWidth = plotWidth / data.length - barGap;
    var labelEvery = width < 500 ? 5 : width < 700 ? 3 : 2;

    for (var value = 0; value <= niceMax; value += tickStep) {
      var y = marginTop + plotHeight - (value / niceMax) * plotHeight;
      svg.appendChild(svgEl("line", {
        class: "ns3-chart__gridline",
        x1: marginLeft, x2: width - marginRight, y1: y, y2: y,
      }));
      var label = svgEl("text", {
        class: "ns3-chart__axis-label",
        x: marginLeft - 8, y: y + 3, "text-anchor": "end",
      });
      label.textContent = value.toLocaleString();
      svg.appendChild(label);
    }

    data.forEach(function (d, i) {
      var x = marginLeft + i * (barWidth + barGap);
      var barHeight = (d.count / niceMax) * plotHeight;
      var y = marginTop + plotHeight - barHeight;

      var rect = svgEl("rect", {
        class: d.partial ? "ns3-chart__bar ns3-chart__bar--partial" : "ns3-chart__bar",
        x: x, y: y, width: barWidth, height: Math.max(barHeight, 1), rx: 4, ry: 4,
      });
      rect.addEventListener("mouseenter", function () { showTooltip(d, rect); });
      rect.addEventListener("mousemove", function () { showTooltip(d, rect); });
      rect.addEventListener("mouseleave", hideTooltip);
      svg.appendChild(rect);

      if (i % labelEvery === 0) {
        var xLabel = svgEl("text", {
          class: "ns3-chart__axis-label",
          x: x + barWidth / 2, y: height - marginBottom + 16, "text-anchor": "middle",
        });
        xLabel.textContent = d.year;
        svg.appendChild(xLabel);
      }
    });
  }

  root.innerHTML = "";
  root.appendChild(svg);
  root.appendChild(tooltip);
  render();

  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 100);
  });

  var note = document.createElement("p");
  note.className = "ns3-chart__note";
  note.textContent = "Lighter bar: " + payload.currentYear + " was still incomplete when this data was fetched (" + payload.fetchedOn + ").";
  root.appendChild(note);

  var details = document.createElement("details");
  details.className = "ns3-chart__table-toggle";
  var summary = document.createElement("summary");
  summary.textContent = "Show data as a table";
  details.appendChild(summary);
  var table = document.createElement("table");
  table.className = "ns3-chart__table";
  var thead = document.createElement("tr");
  ["Year", "Publications"].forEach(function (h) {
    var th = document.createElement("th");
    th.textContent = h;
    thead.appendChild(th);
  });
  table.appendChild(thead);
  data.forEach(function (d) {
    var tr = document.createElement("tr");
    var tdYear = document.createElement("td");
    tdYear.textContent = d.year + (d.partial ? " (partial)" : "");
    var tdCount = document.createElement("td");
    tdCount.textContent = d.count.toLocaleString();
    tr.appendChild(tdYear);
    tr.appendChild(tdCount);
    table.appendChild(tr);
  });
  details.appendChild(table);
  root.appendChild(details);
})();
</script>
