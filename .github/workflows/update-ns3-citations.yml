name: Update ns-3 citations data

on:
  schedule:
    # 04:17 UTC on the 1st of every month
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest OpenAlex data
        run: node scripts/update-ns3-citations.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- static/js/ns3-citations-data.js)" ]; then
            echo "No change in citation data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/ns3-citations-data.js
          git commit -m "chore: update ns-3 citations data from OpenAlex"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site rebuild and deploy
        # A push made with GITHUB_TOKEN does not trigger other workflows'
        # `push` triggers, so the Pages deploy has to be kicked off explicitly.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yml --ref main
