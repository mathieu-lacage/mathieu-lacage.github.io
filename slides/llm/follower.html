<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Followers</title>
<link rel="stylesheet" href="themes/cutebugs.css">
<style>
  /* The follower view is a plain page, not a slide: it only borrows the theme's
     palette and fonts. It mirrors the deck URL carried by the sync messages in an
     iframe, navigated by the deck's own #/h/v/f fragment — the deck itself decides
     how to display each slide (themes/followers.js shows a slide's hidden
     .followers block when embedded). This page only owns the chrome. */
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: #05080e; color: var(--cutebugs-ink);
    font: 15px/1.5 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 20px; padding: 10px 20px; flex: none;
    background: #0f1829; border-bottom: 1px solid #2a3550;
  }
  header .hd { font: 600 17px 'IBM Plex Sans Condensed', sans-serif; letter-spacing: .04em; }
  header .hd small { color: var(--cutebugs-slate); font-weight: 400; }
  .sync { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .live { font: 600 11px/18px 'IBM Plex Mono', monospace; color: var(--cutebugs-slate); letter-spacing: .1em; }
  .live i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3d4a63; margin-right: 6px; vertical-align: 1px; }
  .live.is-on { color: var(--cutebugs-green); }
  .live.is-on i { background: var(--cutebugs-green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .follow {
    font: 500 12px 'IBM Plex Sans', sans-serif; cursor: pointer; border-radius: 14px; padding: 4px 14px;
    color: var(--cutebugs-slate); background: none; border: 1px solid #2a3550;
  }
  .follow.is-on { color: #05080e; background: var(--cutebugs-blue); border-color: var(--cutebugs-blue); }

  main { flex: 1; min-height: 0; position: relative; }

  /* The deck fills the available area at native size: reveal.js scales the slide
     itself (minScale/maxScale), so this adapts to any window, portrait or
     landscape, with no geometry math here. */
  #mirror { position: absolute; inset: 0; }
  #mirror iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; background: #0f1829;
  }

  footer { flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px; border-top: 1px solid #2a3550; background: #0f1829; }
  footer button { font: 600 16px/1 'IBM Plex Mono', monospace; width: 40px; height: 30px; border-radius: 6px; border: 1px solid #2a3550; background: none; color: var(--cutebugs-ink); cursor: pointer; }
  footer button:hover { border-color: var(--cutebugs-blue); }
  #stepno { font: 500 13px 'IBM Plex Mono', monospace; color: var(--cutebugs-slate); min-width: 7em; text-align: center; }
  #rejoin { position: fixed; right: 20px; bottom: 52px; }
  #rejoin button { font: 500 12.5px 'IBM Plex Sans', sans-serif; padding: 6px 14px; border-radius: 14px; cursor: pointer; color: #05080e; background: var(--cutebugs-red); border: none; }
  #demo { position: fixed; right: 16px; top: 60px; z-index: 9; background: #18233a; border: 1px solid #2a3550; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--cutebugs-slate); }
  #demo button { display: block; width: 100%; margin: 4px 0; }

  /* phones: tighter chrome, touch-sized footer buttons */
  @media (max-width: 640px), (max-height: 560px) {
    header { padding: 8px 12px; gap: 12px; }
    header .hd { font-size: 14px; }
    .follow { padding: 6px 12px; }
    footer { padding: 6px; gap: 10px; }
    footer button { width: 72px; height: 40px; }
    #stepno { font-size: 12px; min-width: 6em; }
    #rejoin { right: 12px; bottom: 58px; }
    #demo { right: 12px; left: 12px; top: 56px; }
  }
</style>
</head>
<body>
<header>
  <div class="hd">following <small id="deckname"></small></div>
  <div class="sync">
    <span class="live" id="live"><i></i>LIVE</span>
    <button class="follow is-on" id="follow">following</button>
  </div>
</header>

<main><div id="mirror" hidden></div></main>

<footer hidden>
  <button id="prev" title="previous step">‹</button>
  <span id="stepno">step — </span>
  <button id="next" title="next step">›</button>
</footer>
<div id="rejoin" hidden><button>rejoin presenter</button></div>
<div id="demo" hidden>
  fake presenter (no network)<br>
  <button id="d-prev">slide ‹</button><button id="d-next">slide ›</button>
  <button id="d-step">step ›</button>
</div>

<script>
// ------------------------------------------------------------------- chrome
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const CH = params.get('ch') || localStorage.getItem('syncTopic') || '';

let frame = null, lastMsg = null, following = true, nSteps = 0, cur = null;

function ensureFrame() {
  if (frame) return;
  frame = document.createElement('iframe');
  frame.title = 'mirrored slide';
  frame.addEventListener('load', () => {                // the embedded deck's own keys strip is noise
    try {
      frame.contentDocument.getElementById('keys')?.remove();
      // a hash written while the document was still loading was lost: re-apply
      // the newest pending state now that the frame has committed its URL
      if (frame.dataset.frag) frame.contentWindow.location.hash = frame.dataset.frag;
      postFrontier();                                  // the deck just booted: hand it the frontier
    } catch {}
  });
  $('#mirror').append(frame);
}

// Point the mirror at the state's deck URL and fragment. Same-origin fragments
// are switched in place; anything else reloads the iframe (from the HTTP cache).
// f is sent explicitly, -1 meaning « no step »: omitting the component would
// leave whatever fragments the deck currently shows (reveal's readURL keeps
// them), so the follower ran one step ahead after every step-back.
function show(st) {
  $('#mirror').hidden = false;
  ensureFrame();
  const frag = `#/${st.h}/${st.s}/${st.f >= 0 ? st.f : -1}`;
  if (frame.dataset.base !== st.url) {
    frame.dataset.base = st.url;
    frame.dataset.frag = frag;
    frame.src = st.url + frag;
  } else if (frame.dataset.frag !== frag) {
    frame.dataset.frag = frag;
    try { frame.contentWindow.location.hash = frag; }
    catch { frame.src = st.url + frag; }
  }
}

function apply(st) { cur = st; show(st); }

// The frontier: the furthest slide/step the presenter has ever shown, tracked
// from the sync history (not from what this page happens to display). Nothing
// may go past it — not the detached walk, not the deck's overview — and the
// deck is kept posted so its overview matches.
let maxH = 0, maxF = -1;
function present(st) {
  if (st.h > maxH || (st.h === maxH && st.f > maxF)) { maxH = st.h; maxF = st.f; }
  if (following) apply(st);
  postFrontier();
}
function postFrontier() {
  try { frame?.contentWindow.postMessage({ type: 'followers-frontier', h: maxH, f: maxF }, '*'); } catch {}
}

// Detached navigation walks the mirrored deck's own steps, across slides: the
// step counts come from the deck itself (same origin). f = -1 — slide shown, no
// step yet — participates in the walk like any step, so ← from a slide's first
// step lands on the previous slide's last one.
function stepsOf(h) {
  try {
    const sl = frame.contentWindow.Reveal.getHorizontalSlides()[h];
    return sl ? sl.querySelectorAll('.fragment').length : 0;
  } catch { return 0; }
}
function nSlides() {
  try { return frame.contentWindow.Reveal.getHorizontalSlides().length; } catch { return 1; }
}
function stepNav(delta) {
  if (!cur) return;
  detach();
  let { h, f } = cur;
  f += delta;
  while (f < -1) {                                     // backward past the first step
    if (h <= 0) { f = -1; break; }
    h--; f += stepsOf(h) + 1;
  }
  while (f >= stepsOf(h)) {                            // forward past the last step
    if (h >= nSlides() - 1) { f = stepsOf(h) - 1; break; }
    f -= stepsOf(h) + 1; h++;
  }
  if (h > maxH || (h === maxH && f > maxF)) {          // never past the presenter's frontier
    h = maxH; f = maxF;
  }
  apply({ ...cur, h, f });
}

// The embedded deck reports whether the current slide has followers content and
// where its step stands — that is all the footer knows about the deck.
window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'followers') return;
  if (m.title) $('#deckname').textContent = m.title;   // « following TITLE »
  if (m.select !== undefined) {                        // a past slide picked in the overview
    if (cur && !(following && cur.h === m.select)) {   // picking the slide we're on: no-op
      detach(); apply({ ...cur, h: Math.min(m.select, maxH), f: -1 });
    }
    window.focus();                                    // keys go back to this page
    return;
  }
  if (m.key) {                                         // ←/→ pressed in the mirrored deck
    stepNav(m.key === 'next' ? 1 : -1);
    window.focus();
    return;
  }
  $('footer').hidden = !m.active;
  if (m.active) {
    nSteps = m.nSteps;
    $('#stepno').textContent = m.nSteps ? `step ${m.step} / ${m.nSteps}` : '—';
  }
});

// ←/→ walk the deck's steps across slides (the mirrored deck forwards its own
// keys here, so both focus cases end up on this path)
window.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  stepNav(e.key === 'ArrowRight' ? 1 : -1);
});

// ------------------------------------------------------- detach and rejoin
function detach() {
  if (!following) return;
  following = false;
  $('#follow').classList.remove('is-on');
  $('#follow').textContent = 'detached';
  $('#rejoin').hidden = false;
}
$('#follow').onclick = $('#rejoin').onclick = () => {
  following = true;
  $('#follow').classList.add('is-on');
  $('#follow').textContent = 'following';
  $('#rejoin').hidden = true;
  if (lastMsg) apply(lastMsg);
};
$('#prev').onclick = () => stepNav(-1);
$('#next').onclick = () => stepNav(1);

// ------------------------------------------------------------------ the sync
// The ntfy.sh topic is the password: the deck's « follow along » button (key L) picks
// a random suffix and shows its QR. ?ch= wins over localStorage (same origin as the
// deck). ?demo steps through the mock deck without any network.
if (params.has('demo')) {
  $('#demo').hidden = false;
  const mock = new URL('mockups/sync-presenter.html', location).href;
  let h = 0, f = -1;
  const push = () => present({ ver: 2, url: mock, h, s: 0, f, t: Date.now() });
  $('#d-prev').onclick = () => { h = (h + 2) % 3; f = -1; push(); };
  $('#d-next').onclick = () => { h = (h + 1) % 3; f = -1; push(); };
  $('#d-step').onclick = () => { f = (f + 1) % 13; push(); };
  push();
} else if (CH) {
  const es = new EventSource(`https://ntfy.sh/${CH}/sse?since=12h`);
  es.onopen = () => $('#live').classList.add('is-on');
  es.onerror = () => $('#live').classList.remove('is-on');   // EventSource retries by itself
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (!ev.message) return;                                 // keep-alives etc.
    let st; try { st = JSON.parse(ev.message); } catch { return; }
    if (st.ver !== 2 || (lastMsg && st.t <= lastMsg.t)) return;   // drop replays of old states
    lastMsg = st;
    present(st);
  };
} else {
  $('#deckname').textContent = 'no channel yet — press L in the deck, or add ?ch=… (or ?demo) to this URL';
}
</script>
</body>
</html>
